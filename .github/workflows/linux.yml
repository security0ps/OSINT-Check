name: Linux checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: make test vet release
      - uses: actions/upload-artifact@v4
        with:
          name: osint-check-linux
          path: dist/osint-check-linux-*
