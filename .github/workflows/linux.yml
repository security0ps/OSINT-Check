name: Docker checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - run: go test -race ./... && go vet ./...
      - name: Build and check the Compose service
        working-directory: deploy
        run: |
          cp .env.example .env
          mkdir -p config
          cp config.example.json config/config.json
          docker compose up --build -d --wait --wait-timeout 90 app
          docker compose exec -T app wget -qO- http://127.0.0.1:8484/healthz
          docker compose exec -T app test -s /data/setup-code
          docker compose down
