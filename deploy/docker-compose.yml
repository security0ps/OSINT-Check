# Start: cp .env.example .env, Werte eintragen, dann: docker compose up -d --build
services:
  app:
    build: ..
    restart: unless-stopped
    command: ["--trust-proxy"]
    env_file: .env
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 200
    mem_limit: 512m
    expose: ["8484"]
    volumes:
      - ./config:/config:ro
      - app_data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8484/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    environment:
      - SITE_ADDRESS=${SITE_ADDRESS:?SITE_ADDRESS fehlt in .env}
    ports:
      - "80:80"
      - "443:443"
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging
volumes:
  app_data:
  caddy_data:
  caddy_config:
